name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      # 只改流水线时不重复打包。下次有功能提交仍会发布。
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 取出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 确认这个提交可以发布
        run: |
          # 这次 diff 改了 .github/workflows 时，Actions 自带的 token 创建 Release 会 403。
          # 它没有 workflows 权限，也不能单独加上。这种提交直接停，避免白打包九分钟。
          if git diff --name-only HEAD^ HEAD -- .github/workflows | grep -q .; then
            echo "这次提交改了 .github/workflows，不能用它创建 Release。"
            exit 1
          fi

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 去掉 Windows 上的 Python 路径
        run: |
          # pyramid 里写死了本机路径。Chaquopy 在配置阶段就会读它，不删掉的话六个口味都配不过。
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle

      - name: 安装 Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确认 Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "运行器上没有 Android SDK"
            exit 1
          fi
          # 运行器只带较新的 platform 和 build-tools。这个工程仍用 compileSdk 33、build-tools 30.0.3。
          # 上面已经把 Java 切到 11，给 AGP 7.2 用。sdkmanager 本身是 Java 17 编的，这里单独切回去。
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "运行器上没有 Java 17，sdkmanager 无法启动"
            exit 1
          fi
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "找不到 sdkmanager: $sdkmanager"
            exit 1
          fi
          if [ -w "$sdk_root" ]; then
            sudo_cmd=()
          else
            sudo_cmd=(sudo --preserve-env=JAVA_HOME,PATH)
          fi
          yes | "${sudo_cmd[@]}" "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "${sudo_cmd[@]}" "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-33" "build-tools;30.0.3"
          if [ ! -d "$sdk_root/platforms/android-33" ] || [ ! -d "$sdk_root/build-tools/30.0.3" ]; then
            echo "Android SDK 组件没有装上: platforms;android-33 build-tools;30.0.3"
            exit 1
          fi

      - name: 写入签名
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$RELEASE_STORE_PASSWORD" ] || missing="$missing RELEASE_STORE_PASSWORD"
          [ -n "$RELEASE_KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$RELEASE_KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "缺少 GitHub Secret:$missing"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > app/release.jks
          if [ ! -s app/release.jks ]; then
            echo "签名文件解码后是空的"
            exit 1
          fi

      - name: 生成版本号
        id: meta
        run: |
          tag="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import subprocess
          import sys

          describe = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
              capture_output=True,
              text=True,
          )
          if describe.returncode == 0 and describe.stdout.strip():
              revision = [f"{describe.stdout.strip()}..HEAD"]
          else:
              revision = ["-1"]
          log = subprocess.check_output(
              ["git", "log", "--no-merges", "--reverse", "--pretty=format:%s%x1f%b%x1e", *revision],
              text=True,
          )
          entries = []
          for raw in log.split("\x1e"):
              raw = raw.strip()
              if not raw:
                  continue
              subject, _, body = raw.partition("\x1f")
              subject = subject.strip()
              body_lines = []
              for line in body.splitlines():
                  line = line.rstrip()
                  if not line.strip():
                      continue
                  if line.startswith(("Co-authored-by:", "Signed-off-by:", "Change-Id:")):
                      continue
                  body_lines.append(line)
              if subject:
                  entries.append((subject, body_lines))
          if not entries:
              print("更新内容是空的，停止发布", file=sys.stderr)
              sys.exit(1)
          lines = ["更新内容", ""]
          for subject, body_lines in entries:
              lines.append(f"- {subject}")
              for line in body_lines:
                  lines.append(f"  {line}")
              if body_lines:
                  lines.append("")
          text = "\n".join(lines).rstrip() + "\n"
          with open("release-notes.txt", "w", encoding="utf-8") as notes:
              notes.write(text)
          print(text)
          PY

      - name: 打包六个口味
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/app/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache --max-workers=2 --no-daemon \
            -PVERSION_NAME="${{ steps.meta.outputs.tag }}" \
            -PVERSION_CODE="${{ github.run_number }}"
          mapfile -t apks < <(find app/build/outputs/apk -type f -name 'TVBox_release-*.apk' | sort)
          printf '%s\n' "${apks[@]}"
          if [ "${#apks[@]}" -ne 6 ]; then
            echo "期望 6 个 apk，实际 ${#apks[@]}"
            exit 1
          fi

      - name: 发布到 Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          commit: ${{ github.sha }}
          bodyFile: release-notes.txt
          artifacts: app/build/outputs/apk/**/TVBox_release-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          # 先建草稿，装上安装包，再公开发布。直接发布在部分仓库上会被拒绝。
          immutableCreate: true
